#
# Configuration for Kernel Kdump Bisection (Modular Framework)
#

# === Core Strategies ===
# Defines how the tool should perform key actions.

# INSTALL_STRATEGY: 'git', 'rpm', or unset (auto mode)
# 'git': Bisect commits from a git repository (builds from source).
# 'rpm': Bisect a list of pre-built kernel RPMs only.
# unset: When omitted and KERNEL_RPM_LIST is provided, automatically performs
#        RPM bisect first to find the 1st bad NVR, then transitions to source
#        bisect to find the exact offending commit. GIT_REPO_URL is auto-detected
#        from the NVR dist tag (.el9, .el10, .fc*) if not explicitly set.
INSTALL_STRATEGY="git"

# TEST_STRATEGY: 'panic' or 'simple'
# 'panic': The tool triggers a kernel panic and verifies the result on the next boot.
# 'simple': The tool runs the reproducer and trusts its exit code directly. No panic.
TEST_STRATEGY="panic"

# REBOOT_STRATEGY: 'reboot' or 'kexec'
# 'reboot': Performs a full, normal system reboot.
# 'kexec': Uses 'kexec -e' for a faster reboot (requires kexec to be configured).
REBOOT_STRATEGY="reboot"

# === Git Repository (for INSTALL_STRATEGY="git" or auto mode) ===
# In auto mode, GIT_REPO_URL is auto-detected if not set:
#   .el9 -> https://gitlab.com/redhat/centos-stream/src/kernel/centos-stream-9.git
#   .el10 -> https://gitlab.com/redhat/centos-stream/src/kernel/centos-stream-10.git
#   .fc* -> https://gitlab.com/cki-project/kernel-ark.git
GIT_REPO_URL=https://gitlab.com/cki-project/kernel-ark.git
GIT_REPO_BRANCH=os-build
# LOCAL_GIT_REPO: Path to a local Linux git repo. When set, skips cloning
# GIT_REPO_URL and uses this repo directly for source bisect.
#LOCAL_GIT_REPO="/path/to/local/linux"
KERNEL_SRC_DIR="/path/to/your/linux/source"

# === RPM Configuration (for INSTALL_STRATEGY="rpm") ===
KERNEL_RPM_LIST="/path/to/your/kernel_rpm_list.txt"
RPM_CACHE_DIR="/var/cache/kdump-bisect-rpms"

# === Commit/Version Boundaries ===
# BAD_COMMIT (required): The known-bad commit hash or kernel release version.
# GOOD_COMMIT (optional): The known-good commit hash or kernel release version.
#   If omitted, the tool auto-discovers a good commit by exponential search
#   backward through history (testing commits at ~1, ~2, ~4, ~8, ...).
BAD_COMMIT="<paste_bad_commit_or_version_here>"
GOOD_COMMIT=""

# === Reproducer Script ===
# For 'panic' mode, must contain setup_test() and on_test().
# For 'simple' mode, only on_test() is used and it should run the test and return the result.
REPRODUCER_SCRIPT="/path/to/your/reproducer.sh"
RUNS_PER_COMMIT=3

# === Kernel Build Options (git mode only) ===
MAKE_JOBS=16

# === Bisection Options ===
VERIFY_COMMITS="yes"
